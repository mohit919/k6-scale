name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run plan
      - name: Validate JSON workload plan
        run: |
          npm run plan:json --silent > /tmp/workload-plan.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/workload-plan.json', 'utf8'))"

  k6-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 inspect examples/retail/test.js
